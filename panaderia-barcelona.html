<title>Panadería Barcelona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra superior con saldos, pestañas, y en Flujo diario una columna de registro + columna lateral fija con el arqueo */
:root{
  --bg:#f2f3f1; --surface:#ffffff; --surface-2:#f7f7f5; --line:#dadcd8; --line-2:#e8e9e6;
  --ink:#1c2220; --muted:#5d6662; --accent:#9c4f16; --accent-ink:#ffffff; --accent-soft:#f6e8dc;
  --good:#1d7446; --good-soft:#e0f1e6; --bad:#b3261e; --bad-soft:#fbe5e2; --warn:#7f5a00; --warn-soft:#fbf0d2;
  --focus:#2f6fd6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131615; --surface:#1b1f1d; --surface-2:#222724; --line:#343b37; --line-2:#2a302d;
  --ink:#e8ebe8; --muted:#9ba49f; --accent:#e58c48; --accent-ink:#1b0e04; --accent-soft:#3a2516;
  --good:#5fc78c; --good-soft:#15301f; --bad:#ff8b7d; --bad-soft:#3a1a16; --warn:#e8bb4f; --warn-soft:#352b10; --focus:#7aa7ff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1b1f1d; --surface-2:#222724; --line:#343b37; --line-2:#2a302d;
  --ink:#e8ebe8; --muted:#9ba49f; --accent:#e58c48; --accent-ink:#1b0e04; --accent-soft:#3a2516;
  --good:#5fc78c; --good-soft:#15301f; --bad:#ff8b7d; --bad-soft:#3a1a16; --warn:#e8bb4f; --warn-soft:#352b10; --focus:#7aa7ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num,td.m,th.m,dd,.kpi b,.money-wrap input{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px}
.top-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.45rem;font-weight:700;color:var(--ink)}
.brand h1 span{color:var(--accent)}
.estado{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.estado i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.estado.busy i{background:var(--warn)} .estado.err i{background:var(--bad)}
.saldos{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.saldo{background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;min-width:0}
.saldo small{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.saldo b{font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.saldo b.neg{color:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main.wrap{padding-block:20px 60px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.82rem}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn.icon{padding:5px 10px;font-size:1.1rem;line-height:1}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.block{width:100%;padding:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.note{border-radius:6px;padding:9px 12px;font-size:.85rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}
.note.info{background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.err{color:var(--bad);font-size:.82rem;margin-top:6px}

/* Fields */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:.75rem;font-weight:500;color:var(--muted)}
.fld small{font-size:.74rem;color:var(--muted)}
input[type=text],input[type=date],input[type=month],input[type=number],input[type=search],select{
  height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
input:hover,select:hover{border-color:var(--muted)}
.money-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);height:36px;min-width:0}
.money-wrap:hover{border-color:var(--muted)}
.money-wrap:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.money-wrap::before{content:"$";padding-left:10px;color:var(--muted)}
.money-wrap input{border:0;outline:0;background:transparent;height:100%;padding:0 10px 0 4px;width:100%;min-width:0;text-align:right}
.money-wrap.big{height:46px;font-size:1.25rem}
.formrow{display:grid;gap:10px;align-items:end}
.f-vale{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto}
.f-eg{grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto}
.f-eg.prest{grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) 90px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto}
.f-tr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr) auto}
.btnrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Tables */
.tw{overflow-x:auto;margin-top:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl td.m,.tbl th.m{text-align:right;white-space:nowrap}
.tbl td.act{text-align:right;white-space:nowrap;width:1%}
.tbl tr.editing td{background:var(--accent-soft)}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.sel:hover td{background:var(--accent-soft)}
.tbl tr.off td{color:var(--muted)}
.empty{color:var(--muted);font-size:.85rem;padding:10px 2px 2px}

/* Flujo */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.jnav{display:flex;align-items:center;gap:4px}
.jnav input{width:auto}
.jtitle p{color:var(--muted);font-size:.85rem}
.turns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.turn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.turn b{font-family:var(--f-display);font-size:1.05rem;display:block}
.turn small{color:var(--muted);font-size:.8rem}
.turn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{position:sticky;top:150px}
.ing{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sub{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;font-size:.88rem;color:var(--muted)}
.sub b{color:var(--ink)}
dl.calc{margin:0 0 14px;display:flex;flex-direction:column}
dl.calc div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line-2)}
dl.calc dt{color:var(--muted)} dl.calc dd{margin:0;font-weight:500}
dl.calc div.tot{border-bottom:0;border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
dl.calc div.tot dt{color:var(--ink);font-weight:600} dl.calc div.tot dd{font-weight:700;font-size:1.05rem}
.dif{margin:12px 0;border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dif b{font-size:1.15rem}
.dif.good{background:var(--good-soft);color:var(--good)}
.dif.bad{background:var(--bad-soft);color:var(--bad)}
.dif.even{background:var(--surface-2);color:var(--ink)}
.dif.none{background:var(--surface-2);color:var(--muted);font-size:.85rem}
.closed{display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi b{font-size:1.25rem;font-weight:600;font-family:var(--f-display)}
.kpi b.neg{color:var(--bad)}
.kpi em{font-style:normal;font-size:.78rem;color:var(--muted);display:block}
.sec-title{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}

/* Nómina */
.ntools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.ntools .grp{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.tbl.nom td{padding:5px 8px}
.tbl.nom .money-wrap{height:32px;width:150px;margin-left:auto}
.tbl.nom select{height:32px;width:150px}
.tbl.nom td.n{color:var(--muted);width:1%}
.sub-l{display:block;font-size:.72rem;color:var(--warn)}

/* Trabajadores */
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.wfilters{display:flex;gap:8px;flex-wrap:wrap}
.wfilters input{flex:1 1 180px}
.wfilters select{width:auto}
.f-new{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto}
.det-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.f-det{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* Informes */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

/* Config */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.f-cta{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto}
.f-log{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.tbl.log td{vertical-align:top}
.tbl.log td.w{min-width:160px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,12,11,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:1100px){
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .f-eg,.f-eg.prest{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wgrid,.icols,.cgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding-inline:16px}
  .ing{grid-template-columns:repeat(2,minmax(0,1fr))}
  .turns{grid-template-columns:minmax(0,1fr)}
  .f-vale,.f-eg,.f-eg.prest,.f-tr,.f-new,.f-cta,.f-log,.f-det{grid-template-columns:minmax(0,1fr)}
  .saldos{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><h1>Panadería <span>Barcelona</span></h1><div class="estado" id="estado"><i></i><span>Cargando…</span></div></div>
      <div class="saldos" id="saldos"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="flujo">Flujo diario</button>
      <button class="tab" role="tab" data-tab="nomina">Nómina</button>
      <button class="tab" role="tab" data-tab="trab">Trabajadores</button>
      <button class="tab" role="tab" data-tab="inf">Informes</button>
      <button class="tab" role="tab" data-tab="cfg">Configuración</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><div class="loading">Cargando la información de la panadería…</div></main>
<div id="modal"></div>

<script>
(function(){
'use strict';

/* ───────── Constantes ───────── */
const DATAFONOS=[
  {k:'davivienda',nombre:'Datáfono Davivienda',cuenta:'davivienda'},
  {k:'bancolombia',nombre:'Datáfono Bancolombia',cuenta:'bancolombia'},
  {k:'bold',nombre:'Datáfono Bold',cuenta:'bold'}
];
const CATS={produccion:'Costos de producción',prestamo:'Préstamo a trabajador',gastos:'Gastos',imprevistos:'Imprevistos',aseo:'Aseo',nomina:'Nómina'};
const CATS_MANUAL=['produccion','prestamo','gastos','imprevistos','aseo'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function DEFAULT_CONFIG(){return {
  base:900000,
  cuentas:[
    {id:'cajafuerte',nombre:'Caja fuerte',inicial:0,fija:true},
    {id:'davivienda',nombre:'Davivienda',inicial:0,fija:true},
    {id:'bancolombia',nombre:'Bancolombia',inicial:0,fija:true},
    {id:'bold',nombre:'Bold',inicial:0,fija:true}
  ],
  comision:{davivienda:0,bancolombia:0,bold:0}
};}

/* ───────── Utilidades ───────── */
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const sum=(arr,fn)=>arr.reduce((a,x)=>a+(fn?fn(x):x||0),0)||0;
const clone=o=>JSON.parse(JSON.stringify(o));
function miles(n){return String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function fmt(n){n=Math.round(n||0);return (n<0?'−':'')+'$'+miles(n);}
function fmtIn(n){return (n==null||n==='')?'':miles(n);}
function parseMoney(s){const d=String(s==null?'':s).replace(/[^\d]/g,'');return d===''?null:parseInt(d,10);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseYmd(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function hoy(){return ymd(new Date());}
function fechaLarga(s){const d=parseYmd(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();}
function fechaCorta(s){const d=parseYmd(s);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3);}
function fechaMed(s){const d=parseYmd(s);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function horaDe(iso){if(!iso)return '';const d=new Date(iso);let h=d.getHours();const m=pad(d.getMinutes());const ap=h>=12?'pm':'am';h=h%12||12;return fechaCorta(ymd(d))+' '+h+':'+m+' '+ap;}
/* La jornada lleva la fecha del día en que termina: jornada "2" = día 1 10:00 pm → día 2 10:00 pm */
function jornadaActual(){const d=new Date();if(d.getHours()>=22)d.setDate(d.getDate()+1);return ymd(d);}
function turnoActual(){const h=new Date().getHours();return (h>=22||h<6)?1:(h<14?2:3);}
function ultimoDia(y,m){return new Date(y,m,0).getDate();}
/* Quincenas */
function qDe(f){const p=f.split('-').map(Number);return {y:p[0],m:p[1],q:p[2]<=15?1:2};}
function qId(o){return o.y+'-'+pad(o.m)+'-'+o.q;}
function qParse(id){const p=id.split('-').map(Number);return {y:p[0],m:p[1],q:p[2]};}
function qIdx(o){return o.y*24+(o.m-1)*2+(o.q-1);}
function qFromIdx(i){const y=Math.floor(i/24),r=i-y*24;return {y:y,m:Math.floor(r/2)+1,q:r%2+1};}
function qIdxId(id){return qIdx(qParse(id));}
function qRango(o){return {desde:o.y+'-'+pad(o.m)+'-'+(o.q===1?'01':'16'),hasta:o.y+'-'+pad(o.m)+'-'+(o.q===1?'15':pad(ultimoDia(o.y,o.m)))};}
function qLabel(id){const o=qParse(id);return 'Quincena '+o.q+' · '+(o.q===1?'1 al 15':'16 al '+ultimoDia(o.y,o.m))+' de '+MESES[o.m-1]+' '+o.y;}
function qCorta(id){const o=qParse(id);return 'Q'+o.q+' '+MESES[o.m-1].slice(0,3)+' '+o.y;}

/* ───────── Estado ───────── */
let db=null, downloads=null;
const S={config:DEFAULT_CONFIG(),workers:{},jornadas:{},quincenas:{},egnom:{},logDoc:null,cargado:false,dbOk:false,loadError:null};
const UI={tab:'flujo',fecha:jornadaActual(),turno:turnoActual(),q:qId(qDe(hoy())),drafts:{},edit:null,confirm:null,err:{},wSel:null,wRetiro:null,modal:null,log:null,restore:null,msg:{},focus:null};
function dv(k,def){return Object.prototype.hasOwnProperty.call(UI.drafts,k)?UI.drafts[k]:(def==null?'':def);}
function clearDrafts(prefix){Object.keys(UI.drafts).forEach(k=>{if(k.indexOf(prefix)===0)delete UI.drafts[k];});}

function lugares(){return [{id:'caja',nombre:'Caja'}].concat(S.config.cuentas);}

/* ───────── Persistencia ───────── */
const cola={};let errores=0;
function estado(){
  const el=$('#estado');if(!el)return;
  const busy=Object.keys(cola).length>0;
  el.className='estado'+(!S.dbOk?' err':(errores?' err':(busy?' busy':'')));
  el.querySelector('span').textContent=!S.cargado?'Cargando…':(!S.dbOk?'Sin almacenamiento':(errores?'Error al guardar':(busy?'Guardando…':'Todo guardado')));
}
function retry(fn){return fn().catch(e=>{if(e&&e.code==='unavailable')return new Promise(r=>setTimeout(r,400+Math.random()*600)).then(fn);throw e;});}
function persist(path,data){
  if(!db)return;
  const p=cola[path]||(cola[path]={data:null,running:false});
  p.data=data===null?{__del:true}:clone(data);
  if(!p.running)flush(path);
  estado();
}
async function flush(path){
  const p=cola[path];p.running=true;
  while(p.data){
    const d=p.data;p.data=null;
    try{
      if(d.__del)await retry(()=>db.doc(path).delete());
      else await retry(()=>db.doc(path).set(d));
    }catch(e){errores++;console.error('No se pudo guardar',path,e);aviso('No se pudo guardar un cambio ('+(e&&e.code||'error')+'). Revisa la conexión y vuelve a intentarlo.');}
  }
  delete cola[path];estado();
}
function aviso(t){UI.msg.global=t;const el=$('#aviso-global');if(el){el.hidden=false;el.textContent=t;}}
function saveJornada(f){
  const j=S.jornadas[f];if(!j)return;
  [1,2,3].forEach(n=>{const t=j.turnos[n];if(t.base==null&&tocado(t))t.base=S.config.base;});
  persist('jornadas/'+f,j);
}
function saveQuincena(id){persist('quincenas/'+id,S.quincenas[id]);}
function saveWorker(w){persist('trabajadores/'+w.id,w);}
function saveEgnom(e){persist('egresosnomina/'+e.id,e);}
function delEgnom(id){delete S.egnom[id];persist('egresosnomina/'+id,null);}
function saveConfig(){persist('config/main',S.config);}

async function loadAll(coll,field){
  const out=[];let last=null;
  for(;;){
    let q=db.collection(coll).orderBy(field);
    if(last!==null)q=q.where(field,'>',last);
    const snap=await retry(()=>q.limit(1000).get());
    snap.docs.forEach(d=>{const x=d.data();if(x)out.push(clone(x));});
    if(snap.size<1000)break;
    last=snap.docs[snap.size-1].data()[field];
  }
  return out;
}

/* Registro de cambios: un documento por día (con partes si crece) */
function log(accion,registro,antes,despues){
  const e={t:new Date().toISOString(),a:accion,r:registro,an:antes||'',de:despues||''};
  const dia=hoy();
  let L=S.logDoc;
  if(!L||L.dia!==dia){L=S.logDoc={id:dia+'_1',dia:dia,parte:1,entries:[]};}
  else if(JSON.stringify(L).length>190000){L=S.logDoc={id:dia+'_'+(L.parte+1),dia:dia,parte:L.parte+1,entries:[]};}
  L.entries.push(e);
  persist('cambios/'+L.id,L);
  if(UI.log&&UI.log.entries&&dia>=UI.log.desde&&dia<=UI.log.hasta)UI.log.entries.unshift(e);
}

/* ───────── Modelo: jornadas y turnos ───────── */
function nuevoTurno(){return {base:null,ingresos:{davivienda:null,bancolombia:null,bold:null,efectivo:null},vales:[],egresos:[],traslados:[],contado:null,cerrado:false,cerradoEn:null};}
function tocado(t){return Object.values(t.ingresos).some(v=>v!=null)||t.vales.length||t.egresos.length||t.traslados.length||t.contado!=null;}
function getJornada(f,crear){if(!S.jornadas[f]&&crear)S.jornadas[f]={fecha:f,turnos:{1:nuevoTurno(),2:nuevoTurno(),3:nuevoTurno()}};return S.jornadas[f];}
function turnoLeer(f,n){const j=S.jornadas[f];return j?j.turnos[n]:nuevoTurno();}
function turnoMut(){return getJornada(UI.fecha,true).turnos[UI.turno];}
function turnoBase(t){return t.base!=null?t.base:S.config.base;}
function ctxTurno(f,n){return 'Jornada '+fechaMed(f||UI.fecha)+' · Turno '+(n||UI.turno);}
function turnoRango(f,n){const a=addDays(f,-1);return n===1?fechaCorta(a)+' 10:00 pm – '+fechaCorta(f)+' 6:00 am':n===2?fechaCorta(f)+' 6:00 am – 2:00 pm':fechaCorta(f)+' 2:00 pm – 10:00 pm';}
function neto(k,v){const p=Number(S.config.comision[k]||0);return Math.round((v||0)*(1-p/100));}
function ingresosDinero(t){return (t.ingresos.davivienda||0)+(t.ingresos.bancolombia||0)+(t.ingresos.bold||0)+(t.ingresos.efectivo||0);}
function egnomDe(f,n){return Object.values(S.egnom).filter(e=>e.jornada===f&&(n===undefined?true:e.turno===n));}
function arqueo(f,n){
  const t=turnoLeer(f,n),base=turnoBase(t),efectivo=t.ingresos.efectivo||0;
  const egCaja=sum(t.egresos.filter(e=>e.origen==='caja'),e=>e.valor)+sum(egnomDe(f,n).filter(e=>e.origen==='caja'),e=>e.valor);
  const trOut=sum(t.traslados.filter(x=>x.origen==='caja'),x=>x.valor);
  const trIn=sum(t.traslados.filter(x=>x.destino==='caja'),x=>x.valor);
  const esperado=base+efectivo-egCaja-trOut+trIn;
  const contado=t.contado;
  const aFuerte=(t.cerrado&&contado!=null)?Math.max(0,contado-base):0;
  return {base,efectivo,egCaja,trOut,trIn,esperado,contado,dif:contado==null?null:contado-esperado,aFuerte,cerrado:t.cerrado};
}
function egresosTurno(f,n){const t=turnoLeer(f,n);return sum(t.egresos,e=>e.valor)+sum(egnomDe(f,n),e=>e.valor);}

function calcSaldos(){
  const s={};S.config.cuentas.forEach(c=>s[c.id]=c.inicial||0);
  const add=(id,v)=>{if(id!=='caja'&&s[id]!==undefined)s[id]+=v;};
  Object.values(S.jornadas).forEach(j=>{[1,2,3].forEach(n=>{
    const t=j.turnos[n];
    DATAFONOS.forEach(d=>add(d.cuenta,neto(d.k,t.ingresos[d.k])));
    t.egresos.forEach(e=>add(e.origen,-e.valor));
    t.traslados.forEach(x=>{add(x.origen,-x.valor);add(x.destino,x.valor);});
    if(t.cerrado&&t.contado!=null)add('cajafuerte',Math.max(0,t.contado-turnoBase(t)));
  });});
  Object.values(S.egnom).forEach(e=>add(e.origen,-e.valor));
  return s;
}

/* ───────── Modelo: deudas ───────── */
function cargosIndex(){
  const C={};
  Object.values(S.jornadas).forEach(j=>{const f=j.fecha,qi=qIdx(qDe(f));[1,2,3].forEach(n=>{
    const t=j.turnos[n];
    t.vales.forEach(v=>{(C[v.workerId]=C[v.workerId]||[]).push({tipo:'Vale',fecha:f,turno:n,monto:v.valor,due:qi,ref:v.id});});
    t.egresos.forEach(e=>{if(e.cat!=='prestamo'||!e.workerId)return;
      const k=Math.max(1,parseInt(e.cuotas,10)||1),b=Math.floor(e.valor/k);
      for(let i=0;i<k;i++)(C[e.workerId]=C[e.workerId]||[]).push({tipo:'Préstamo',fecha:f,turno:n,monto:i<k-1?b:e.valor-b*(k-1),due:qi+i,cuota:i+1,de:k,ref:e.id,desc:e.desc,total:e.valor});
    });
  });});
  return C;
}
function descontado(wid,exceptQ){let s=0;Object.values(S.quincenas).forEach(Q=>{if(Q.id===exceptQ)return;const f=Q.filas&&Q.filas[wid];if(f&&f.pagado)s+=f.descontado||0;});return s;}
function esUltimo(w,qid){return !!(w&&w.activo&&w.retiro&&!w.retiro.completado&&qIdxId(qid)>=qIdxId(w.retiro.q));}
function deudaPara(wid,qid,C){
  const w=S.workers[wid],idx=qIdxId(qid),ult=esUltimo(w,qid);
  const c=sum((C[wid]||[]).filter(x=>ult||x.due<=idx),x=>x.monto);
  return Math.max(0,c-descontado(wid,qid));
}
function saldoWorker(wid,C){return sum(C[wid]||[],x=>x.monto)-descontado(wid);}
function deudasHoy(C){return sum(Object.keys(S.workers),id=>Math.max(0,saldoWorker(id,C)));}

  $('#saldos').innerHTML=S.cargado?vSaldos():'';
  $('#main').innerHTML=!S.cargado?'<div class="loading">Cargando la información de la panadería…</div>':
    vAvisos()+(UI.tab==='flujo'?vFlujo():UI.tab==='nomina'?vNomina():UI.tab==='trab'?vTrab():UI.tab==='inf'?vInf():vCfg());

}

function difHTML(contado,esperado){
  if(contado==null)return '<div class="dif none">Escribe el efectivo contado para ver la diferencia.</div>';
  const d=contado-esperado;
  if(d>0)return '<div class="dif good"><span>Sobrante</span><b class="num">'+fmt(d)+'</b></div>';
  if(d<0)return '<div class="dif bad"><span>Faltante</span><b class="num">'+fmt(-d)+'</b></div>';
  return '<div class="dif even"><span>Sin diferencia</span><b class="num">$0</b></div>';
}
function fuerteHTML(contado,base,cerrado){
  if(contado==null)return '';

  return '<div class="note '+(cerrado?'good':'info')+'">'+(cerrado?'Pasó a la Caja fuerte: ':'Al cerrar pasan a la Caja fuerte: ')+'<b class="num">'+fmt(contado-base)+'</b></div>';

function quincenaMut(id){if(!S.quincenas[id])S.quincenas[id]={id:id,filas:{}};return S.quincenas[id];}
function filaMut(qid,wid){const Q=quincenaMut(qid);if(!Q.filas[wid])Q.filas[wid]={valor:null,origen:'',pagado:false};return Q.filas[wid];}
function trabajadoresEnQ(qid){const fil=(S.quincenas[qid]||{}).filas||{};return workersOrden().filter(w=>(fil[w.id]&&fil[w.id].pagado)||w.activo);}
function filasNomina(qid){
  const Q=S.quincenas[qid]||{filas:{}},C=cargosIndex();
  return trabajadoresEnQ(qid).map(w=>{
    const f=Q.filas[w.id]||{valor:null,origen:'',pagado:false};
    if(f.pagado)return {w:w,f:f,valor:f.valor,deuda:f.deuda,desc:f.descontado,pago:f.pago,pagado:true,ultimo:!!f.ultimo};
    const deuda=deudaPara(w.id,qid,C),valor=f.valor;
    const desc=valor==null?null:Math.min(deuda,valor);
    return {w:w,f:f,valor:valor,deuda:deuda,desc:desc,pago:valor==null?null:valor-desc,pagado:false,ultimo:esUltimo(w,qid)};
  });
}

function rangoInforme(){
  const tipo=dv('inf-tipo','diario');
  if(tipo==='diario'){const f=dv('inf-dia',jornadaActual());return {tipo,desde:f,hasta:f,titulo:'Jornada del '+fechaLarga(f)};}
  if(tipo==='semanal'){const f=dv('inf-sem',jornadaActual());const d=parseYmd(f);const lun=addDays(f,-((d.getDay()+6)%7));const dom=addDays(lun,6);return {tipo,desde:lun,hasta:dom,titulo:'Semana del lunes '+fechaMed(lun)+' al domingo '+fechaMed(dom)};}
  if(tipo==='quincenal'){const id=dv('inf-q',qId(qDe(hoy())));const r=qRango(qParse(id));return {tipo,desde:r.desde,hasta:r.hasta,titulo:qLabel(id)};}
  const m=dv('inf-mes',hoy().slice(0,7));const p=m.split('-').map(Number);return {tipo,desde:m+'-01',hasta:m+'-'+pad(ultimoDia(p[0],p[1])),titulo:MESES[p[1]-1].replace(/^./,c=>c.toUpperCase())+' de '+p[0]};
}
function calcInforme(desde,hasta){
  const R={ing:{davivienda:0,bancolombia:0,bold:0,efectivo:0},vales:0,eg:{},dias:{}};
  Object.keys(CATS).forEach(c=>R.eg[c]=0);
  const dia=f=>R.dias[f]||(R.dias[f]={ing:0,vales:0,eg:0});
  Object.values(S.jornadas).forEach(j=>{if(j.fecha<desde||j.fecha>hasta)return;[1,2,3].forEach(n=>{const t=j.turnos[n];
    Object.keys(R.ing).forEach(k=>R.ing[k]+=t.ingresos[k]||0);
    const v=sum(t.vales,x=>x.valor);R.vales+=v;
    t.egresos.forEach(e=>R.eg[e.cat]+=e.valor);
    const D=dia(j.fecha);D.ing+=ingresosDinero(t);D.vales+=v;D.eg+=sum(t.egresos,e=>e.valor);
  });});
  Object.values(S.egnom).forEach(e=>{if(e.jornada<desde||e.jornada>hasta)return;R.eg.nomina+=e.valor;dia(e.jornada).eg+=e.valor;});
  R.totIng=sum(Object.values(R.ing));R.totEg=sum(Object.values(R.eg));
  return R;
}

/* ───────── Acciones ───────── */
function err(k,m){UI.err[k]=m;render();}
function guardarVale(){
  const w=dv('vale-w'),v=parseMoney(dv('vale-v')),o=dv('vale-o');
  if(!w)return err('vale','Elige el trabajador.');
  if(!v)return err('vale','Escribe el valor del vale.');
  if(!o)return err('vale','Elige de dónde sale el dinero del vale.');
  const T=turnoMut(),ctx=ctxTurno();
  if(UI.edit&&UI.edit.kind==='vale'){const r=T.vales.find(x=>x.id===UI.edit.id);if(r){const an=dVale(r);r.workerId=w;r.valor=v;r.origen=o;log('Editó','Vale · '+ctx,an,dVale(r));}UI.edit=null;}
  else{const r={id:uid(),workerId:w,valor:v,origen:o};T.vales.push(r);log('Creó','Vale · '+ctx,'',dVale(r));}
  delete UI.drafts['vale-w'];delete UI.drafts['vale-v'];UI.err.vale=null;saveJornada(UI.fecha);UI.focus='d-vale-w';render();
}
function guardarEgreso(){
  const cat=dv('eg-cat','produccion'),v=parseMoney(dv('eg-v')),o=dv('eg-o','caja'),desc=dv('eg-desc').trim();
  const w=dv('eg-w'),cu=parseInt(dv('eg-cuotas','1'),10);
  if(cat==='prestamo'&&!w)return err('eg','Elige el trabajador del préstamo.');
  if(cat==='prestamo'&&!(cu>=1&&cu<=24))return err('eg','Las cuotas deben ser entre 1 y 24 quincenas.');
  if(!v)return err('eg','Escribe el valor del egreso.');
  if(cat!=='prestamo'&&!desc)return err('eg','Escribe una descripción.');
  const T=turnoMut(),ctx=ctxTurno();
  const datos={cat:cat,desc:desc,valor:v,origen:o,workerId:cat==='prestamo'?w:null,cuotas:cat==='prestamo'?cu:null};
  if(UI.edit&&UI.edit.kind==='egreso'){const r=T.egresos.find(x=>x.id===UI.edit.id);if(r){const an=dEgreso(r);Object.assign(r,datos);log('Editó','Egreso · '+ctx,an,dEgreso(r));}UI.edit=null;}
  else{const r=Object.assign({id:uid()},datos);T.egresos.push(r);log('Creó','Egreso · '+ctx,'',dEgreso(r));}
  ['eg-v','eg-desc','eg-w','eg-cuotas'].forEach(k=>delete UI.drafts[k]);UI.err.eg=null;saveJornada(UI.fecha);UI.focus='d-eg-desc';render();
}
function guardarTraslado(){
  const o=dv('tr-o'),d=dv('tr-d'),v=parseMoney(dv('tr-v')),desc=dv('tr-desc').trim();
  if(!o||!d)return err('tr','Elige de dónde sale y a dónde entra el dinero.');
  if(o===d)return err('tr','El origen y el destino deben ser distintos.');
  if(!v)return err('tr','Escribe el valor del traslado.');
  const T=turnoMut(),ctx=ctxTurno(),datos={origen:o,destino:d,valor:v,desc:desc};
  if(UI.edit&&UI.edit.kind==='traslado'){const r=T.traslados.find(x=>x.id===UI.edit.id);if(r){const an=dTraslado(r);Object.assign(r,datos);log('Editó','Traslado · '+ctx,an,dTraslado(r));}UI.edit=null;}
  else{const r=Object.assign({id:uid()},datos);T.traslados.push(r);log('Creó','Traslado · '+ctx,'',dTraslado(r));}
  clearDrafts('tr-');UI.err.tr=null;saveJornada(UI.fecha);UI.focus='d-tr-o';render();
}
function editar(kind,id){
  const t=turnoLeer(UI.fecha,UI.turno);UI.confirm=null;
  if(kind==='vale'){const r=t.vales.find(x=>x.id===id);if(!r)return;UI.drafts['vale-w']=r.workerId;UI.drafts['vale-v']=fmtIn(r.valor);UI.drafts['vale-o']=r.origen||'';UI.focus='d-vale-v';}
  if(kind==='egreso'){const r=t.egresos.find(x=>x.id===id);if(!r)return;Object.assign(UI.drafts,{'eg-cat':r.cat,'eg-v':fmtIn(r.valor),'eg-o':r.origen,'eg-desc':r.desc||'','eg-w':r.workerId||'','eg-cuotas':String(r.cuotas||1)});UI.focus='d-eg-v';}
  if(kind==='traslado'){const r=t.traslados.find(x=>x.id===id);if(!r)return;Object.assign(UI.drafts,{'tr-o':r.origen,'tr-d':r.destino,'tr-v':fmtIn(r.valor),'tr-desc':r.desc||''});UI.focus='d-tr-v';}
  UI.edit={kind:kind,id:id};render();
}
function borrar(kind,id){
  if(UI.confirm!==kind+':'+id){UI.confirm=kind+':'+id;render();return;}
  UI.confirm=null;const T=turnoMut(),ctx=ctxTurno();
  const lst=kind==='vale'?T.vales:kind==='egreso'?T.egresos:T.traslados;
  const i=lst.findIndex(x=>x.id===id);if(i<0)return render();
  const r=lst[i];lst.splice(i,1);
  log('Borró',(kind==='vale'?'Vale':kind==='egreso'?'Egreso':'Traslado')+' · '+ctx,kind==='vale'?dVale(r):kind==='egreso'?dEgreso(r):dTraslado(r),'');
  if(UI.edit&&UI.edit.id===id){UI.edit=null;}
  saveJornada(UI.fecha);render();
}
function cancelarEdit(){const k=UI.edit&&UI.edit.kind;UI.edit=null;if(k==='vale')clearDrafts('vale-');if(k==='egreso')clearDrafts('eg-');if(k==='traslado')clearDrafts('tr-');render();}
function cambiarJornada(f){if(!f)return;UI.fecha=f;UI.edit=null;UI.confirm=null;UI.err={};render();}
function cerrarTurno(){
  const el=$('#arq-contado');if(el){const v=parseMoney(el.value);const t0=turnoLeer(UI.fecha,UI.turno);if(v!==t0.contado)commitContado(v,true);}
  const t=turnoMut();
  if(t.contado==null){UI.err.cerrar='Escribe el efectivo contado antes de cerrar el turno.';UI.focus='arq-contado';render();return;}
  t.cerrado=true;t.cerradoEn=new Date().toISOString();UI.err.cerrar=null;
  const A=arqueo(UI.fecha,UI.turno);
  log('Cerró turno',ctxTurno(),'','Contado '+fmt(A.contado)+' · Esperado '+fmt(A.esperado)+' · '+(A.dif>0?'Sobrante '+fmt(A.dif):A.dif<0?'Faltante '+fmt(-A.dif):'Sin diferencia')+' · A Caja fuerte '+fmt(A.aFuerte));
  saveJornada(UI.fecha);render();
}
function reabrirTurno(){const t=turnoMut();t.cerrado=false;log('Reabrió turno',ctxTurno(),'Cerrado','Abierto');saveJornada(UI.fecha);render();}
function commitContado(v,silent){
  const t=turnoMut();if(v===t.contado)return;
  const an=t.contado;t.contado=v;log(an==null?'Creó':'Editó','Efectivo contado · '+ctxTurno(),an==null?'':fmt(an),v==null?'':fmt(v));
  saveJornada(UI.fecha);if(!silent)later();
}

function leerRestore(file){

async function restaurar(){
  const d=UI.restore.data;
  if(!db){UI.restore.progreso='El almacenamiento no está disponible.';return render();}
  const ops=[];
  const plan=(coll,actual,nuevo)=>{Object.keys(actual).forEach(id=>{if(!nuevo[id])ops.push(()=>db.doc(coll+'/'+id).delete());});Object.keys(nuevo).forEach(id=>ops.push(()=>db.doc(coll+'/'+id).set(nuevo[id])));};
  UI.restore.progreso='Leyendo información actual…';render();
  try{
    const camAct={};(await loadAll('cambios','id')).forEach(c=>camAct[c.id]=c);
    const camNew={};(d.cambios||[]).forEach(c=>{if(c&&c.id)camNew[c.id]=c;});
    plan('trabajadores',S.workers,d.trabajadores||{});plan('jornadas',S.jornadas,d.jornadas||{});plan('quincenas',S.quincenas,d.quincenas||{});plan('egresosnomina',S.egnom,d.egresosnomina||{});plan('cambios',camAct,camNew);
    ops.push(()=>db.doc('config/main').set(d.config));
    let hechos=0;
    const worker=async()=>{while(ops.length){const op=ops.shift();await retry(op);hechos++;if(hechos%10===0){UI.restore.progreso='Restaurando… '+hechos+' registros';render();}}};
    await Promise.all([worker(),worker(),worker(),worker()]);
    S.config=Object.assign(DEFAULT_CONFIG(),d.config);S.workers=d.trabajadores||{};S.jornadas=d.jornadas||{};S.quincenas=d.quincenas||{};S.egnom=d.egresosnomina||{};
    S.logDoc=null;await cargarLogHoy();
    log('Restauró','Copia de seguridad · '+UI.restore.nombre,'','Información reemplazada');
    UI.modal=null;UI.msg.backup='Copia restaurada ('+hechos+' registros).';UI.restore=null;UI.log=null;
  }catch(e){UI.restore.progreso='La restauración se interrumpió ('+(e&&e.code||'error')+'). Vuelve a intentarlo con el mismo archivo.';}
  render();
}

  }
  if(db){
    try{
      const res=await Promise.all([retry(()=>db.doc('config/main').get()),loadAll('trabajadores','orden'),loadAll('jornadas','fecha'),loadAll('quincenas','id'),loadAll('egresosnomina','id')]);
      const cfg=res[0].exists?clone(res[0].data()):null;
      if(cfg){const D=DEFAULT_CONFIG();S.config=Object.assign(D,cfg,{comision:Object.assign(D.comision,cfg.comision||{})});if(!cfg.cuentas)S.config.cuentas=D.cuentas;}

      res[2].forEach(j=>S.jornadas[j.fecha]=j);
      res[3].forEach(q=>{q.filas=q.filas||{};S.quincenas[q.id]=q;});
      res[4].forEach(e=>S.egnom[e.id]=e);
      await cargarLogHoy();
      S.dbOk=true;
    }catch(e){S.loadError=(e&&e.code)||String(e);db=null;}
  }
  S.cargado=true;render();
}
init();
})();
</script>
